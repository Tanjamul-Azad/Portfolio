# Only immutable, content-hashed media is served directly by Nginx.
# Application pages, admin screens and API responses keep their normal policies.
location ^~ /_next/static/ {
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css application/javascript application/json application/wasm;
    alias /var/www/tanzamul-assets/next-static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    etag on;
    access_log off;
}

location ^~ /images/optimized/ {
    alias /var/www/tanzamul-assets/optimized/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    etag on;
    access_log off;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
}

location ^~ /images/tech-icons/ {
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types image/svg+xml application/json;
    alias /var/www/tanzamul-assets/tech-icons/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    etag on;
    access_log off;
    open_file_cache max=200 inactive=60s;
    open_file_cache_valid 120s;
}
